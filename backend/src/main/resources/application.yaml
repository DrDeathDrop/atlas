spring:
  application:
    name: atlas

  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5433/atlas}
    username: ${ATLAS_DB_APP_USER:atlas_app}
    password: ${ATLAS_DB_APP_PASSWORD:atlas_app}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${ATLAS_RABBIT_HOST:localhost}
    port: ${ATLAS_RABBIT_PORT:5672}
    username: ${ATLAS_RABBIT_USER:atlas}
    password: ${ATLAS_RABBIT_PASSWORD:atlas}
    listener:
      simple:
        default-requeue-rejected: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas}
    parameters:
      appUserPassword: ${ATLAS_DB_APP_PASSWORD:atlas_app}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

management:
  server:
    port: ${ATLAS_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

atlas:
  security:
    jwt:
      secret: ${ATLAS_JWT_SECRET:}
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
  simulation:
    tick: 1s
  events:
    relay-delay: 1s
    cleanup-delay: 1h
  demo-data:
    enabled: ${ATLAS_DEMO_DATA:false}
  bootstrap:
    admin:
      email: ${ATLAS_ADMIN_EMAIL:admin@atlas.local}
      password: ${ATLAS_ADMIN_PASSWORD:}
