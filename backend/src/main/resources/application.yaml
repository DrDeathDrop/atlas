spring:
  application:
    name: atlas

  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5433/atlas}
    username: ${ATLAS_DB_USER:atlas}
    password: ${ATLAS_DB_PASSWORD:atlas}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080
  forward-headers-strategy: native

atlas:
  security:
    jwt:
      secret: ${ATLAS_JWT_SECRET:}
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
  bootstrap:
    admin:
      email: ${ATLAS_ADMIN_EMAIL:admin@atlas.local}
      password: ${ATLAS_ADMIN_PASSWORD:}
