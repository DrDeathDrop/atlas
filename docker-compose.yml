services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "5433:5432"
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: atlas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: atlas
      RABBITMQ_DEFAULT_PASS: atlas
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - atlas-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["full"]
    build: ./backend
    container_name: atlas-backend
    environment:
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas
      ATLAS_DB_USER: atlas
      ATLAS_DB_PASSWORD: atlas
      ATLAS_DEMO_DATA: "true"
      ATLAS_RABBIT_HOST: rabbitmq
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build: ./frontend
    container_name: atlas-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  atlas-postgres-data:
  atlas-rabbitmq-data:
