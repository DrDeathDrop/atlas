<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/">
    <img src="favicon.svg" alt="" width="32" height="32" />
    <span>Atlas</span>
  </a>

  <nav class="nav">
    <a mat-button routerLink="/incidents" routerLinkActive="active">Incidents</a>
    <a mat-button routerLink="/map" routerLinkActive="active">Map</a>
    <a mat-button routerLink="/resources" routerLinkActive="active">Resources</a>
  </nav>

  <span class="spacer"></span>

  <span class="live" [class.on]="isLive()" role="status">
    <span class="dot" aria-hidden="true"></span>{{ isLive() ? 'Live' : 'Offline' }}
  </span>

  <app-notification-bell />

  @if (user(); as current) {
    <span class="user">
      <span class="name">{{ current.fullName }}</span>
      <span class="role">{{ current.role }}</span>
    </span>
  }

  <button mat-button type="button" (click)="logout()">Log out</button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
