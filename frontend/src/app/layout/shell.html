<mat-toolbar class="toolbar">
  <span class="brand">Atlas</span>

  <nav class="nav">
    <a mat-button routerLink="/incidents" routerLinkActive="active">Incidents</a>
    <a mat-button routerLink="/map" routerLinkActive="active">Map</a>
    <a mat-button routerLink="/resources" routerLinkActive="active">Resources</a>
  </nav>

  <span class="spacer"></span>

  @if (user(); as current) {
    <span class="user">
      <span class="name">{{ current.fullName }}</span>
      <span class="role">{{ current.role }}</span>
    </span>
  }

  <button mat-button type="button" (click)="logout()">Log out</button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
